# Pushing a tag such as v6.0.0 publishes the release the one-line installers download:
# ghostswitch.tar.gz (macOS, Linux), ghostswitch.zip (Windows) and their SHA256SUMS.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the version in pyproject.toml
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }

      - name: Build the app archives
        # git archive leaves out what .gitattributes marks export-ignore.
        run: |
          mkdir dist
          git archive --format=tar.gz --prefix=ghostswitch/ -o dist/ghostswitch.tar.gz "$GITHUB_REF_NAME"
          git archive --format=zip --prefix=ghostswitch/ -o dist/ghostswitch.zip "$GITHUB_REF_NAME"
          cd dist && sha256sum ghostswitch.tar.gz ghostswitch.zip > SHA256SUMS && cat SHA256SUMS

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "GhostSwitch $GITHUB_REF_NAME" --generate-notes --verify-tag
